name: virochart-stan

channels:
  - conda-forge
  - bioconda
  - nodefaults

dependencies:
  # Workflow engine and Python preprocessing
  - python=3.11.15
  - snakemake=9.20.0
  - numpy>=2.0,<3
  - pandas=2.3.3
  - scipy>=1.10,<2
  # Keep the serializer versions aligned with the distributed scaler.joblib.
  - scikit-learn=1.8.0
  - joblib=1.5.3
  - pyyaml>=6,<7

  # FASTQ QC, mapping, counting, and reference download
  - fastp=1.3.3
  - hisat2=2.2.2
  - samtools=1.23.1
  - subread=2.1.1
  - ncbi-datasets-cli=18.26.0

  # R, Stan, and build toolchain
  - r-base=4.4.1
  - r-jsonlite=2.0.0
  - r-cmdstanr=0.8.1
  - cmdstan=2.36.0
  - make>=4.3
  - cxx-compiler
